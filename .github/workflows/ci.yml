name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stride
          POSTGRES_PASSWORD: stride
          POSTGRES_DB: stride
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stride"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stride:stride@localhost:5432/stride
      TEST_DATABASE_URL: postgresql://stride:stride@localhost:5432/stride_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Type-check
        run: bunx tsc --noEmit -p .
      - name: Lint
        run: bun run lint
      - name: Tests (GPS accuracy + privacy, security and data API tests)
        run: bun test
      - name: Build
        run: bun run build
